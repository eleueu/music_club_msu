<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/icon.png" />
    <title>Клуб классической музыки МГУ | Вступление в Клуб</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div id="stage">
        <main id="page">
            <img class="afisha-shading" src="../assets//afisha/shading.png">
            <div class="afisha-start">
                <img class="members-sky" src="../assets/team/start-sky.png">
                <img class="page-logo" src="../assets/logo.svg">
                <img class="afisha-sky" src="../assets/afisha/starry-sky.png">
            </div>
            <div class="afisha-heading">
                <p class="font-pd-mi-32">Афиша</p>
            </div>
            <div class="actual">
                <img class="actual-pic" src="../assets/afisha/picture.png">
                <div class="desc">
                    <div class="info">
                        <div class="name">
                            <p class="font-pd-m-24">Новый сезон</p>
                            <p class="font-lato-12">Концерт классической музыки</p>
                        </div>
                        <div class="datetime">
                            <div class="data">
                                <p class="font-pd-mi-28">24</p>
                                <p class="font-pd-mi-16">сентября</p>
                            </div>
                            <p class="font-pd-mi-28">19:00</p>
                        </div>
                        <div class="place">
                            <p class="font-lato-12">Государственный исторический музей</p>
                            <p class="font-lato-12">Красная площадь, д. 1</p>
                        </div>
                    </div>
                    <button class="register-btn" id="registerBtn">Приобрести билет</button>
                </div>
            </div>
            <div class="past">
                <p class="font-pd-m-24">
                    <span class="font-pd-mi-24">Прошедшие&nbsp;</span>мероприятия
                </p>
                <div class="past-list">
                    <div class="past-card">
                        <img src="../assets/afisha/120926.png">
                    </div>
                    <div class="past-card">
                        <img src="../assets/afisha/270626.png">
                    </div>
                    <div class="past-card">
                        <img src="../assets/afisha/210526.png">
                    </div>
                    <div class="past-card">
                        <img src="../assets/afisha/280426.png">
                    </div>
                    <div class="past-card">
                        <img src="../assets/afisha/160426.png">
                    </div>
                    <div class="past-card">
                        <img src="../assets/afisha/270326.png">
                    </div>
                </div>
                <button class="show-more-btn" id="showMoreBtn">
                    <p>Показать ещё...</p>
                </button>
            </div>
            <div class="footer">
                <div class="afisha-contacts">
                    <a href="https://t.me/music_club_msu" target="_blank" class="cont-link">
                        <div class="link-tg-vk">
                            <img src="../assets/tg-icon.svg" height="16" width="19">
                            <p class="font-lato-12">music_club_msu</p>
                        </div>
                    </a>
                    <a href="https://vk.ru/music_club_msu" target="_blank" class="cont-link">
                        <div class="link-tg-vk">
                            <img src="../assets/vk-icon.svg" height="12" width="19">
                            <p class="font-lato-12">music_club_msu</p>
                        </div>
                    </a>
                </div>
            </div>
        </main>
        <button class="burger" id="burger" aria-label="Меню">
            <img class="burger-img" src="../assets/burger.svg">
        </button>
        <div class="overlay" id="overlay"></div>
        <nav class="side-menu" id="sideMenu">
            <div class="menu-logo">
                <img src="../assets/logo.svg" alt="Логотип Клуба классической музыки МГУ">
            </div>
            <div class="menu-links">
                <a href="../index.html">Главная</a>
                <a href="../team/index.html">Участники Клуба</a>
                <a href="../afisha/index.html" class="active">Афиша</a>
                <a href="../join/index.html">Вступить в Клуб</a>
            </div>
        </nav>
    </div>
    <script src="../js/script.js"></script>
</body>
