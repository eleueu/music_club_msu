<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/icon.png" />
    <title>Клуб классической музыки МГУ | Вступление в Клуб</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div id="stage">
        <main id="page">
            <div class="success-start">
                <img class="shading" src="../assets/shading.png">
                <img class="join-sky" src="../assets/join-sky.png">
                <img class="page-logo" src="../assets/logo.svg">
                <div class="join-heading">
                    <p class="font-pd-m-24">Анкета успешно отправлена!</p>
                </div>
            </div>
            <div class="message">
                <img class="success-orbit" src="../assets/team/members-orbit.png">
                <img class="success-star-1" src="../assets/star.svg">
                <img class="success-star-2" src="../assets/star.svg">
                <img class="success-star-3" src="../assets/star.svg">
                <p class="font-pd-mi-16">Спасибо, что хотите стать частью<br />Клуба классической музыки МГУ!</p>
                <p class="font-lato-12">Мы свяжемся с Вами в ближайшее время</p>
                <div class="buttons">
                    <button class="refill-btn" id="refill-btn">Заполнить ещё раз</button>
                    <button class="share-btn" id="share-btn">Поделиться анкетой</button>
                </div>
            </div>
            <button class="home-btn" id="home-btn">На главную</button>
        </main>
        <button class="burger" id="burger" aria-label="Меню">
            <img class="burger-img" src="../assets/burger.svg">
        </button>
        <div class="overlay" id="overlay"></div>
        <nav class="side-menu" id="sideMenu">
            <div class="menu-logo">
                <img src="../assets/logo.svg" alt="Логотип Клуба классической музыки МГУ">
            </div>
            <div class="menu-links">
                <a href="../index.html">Главная</a>
                <a href="../team/index.html">Участники Клуба</a>
                <a href="#">Афиша</a>
                <a href="#">Архив</a>
                <a href="../join/index.html">Вступить в Клуб</a>
            </div>
        </nav>
    </div>
    <script src="../js/script.js"></script>
</body>
